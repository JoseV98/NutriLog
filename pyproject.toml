[project]
name = "nutrilog"
version = "0.1.0"
description = "Aplicación para llevar el registro de pacientes de nutrición"
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "José Vílchez", email = "joseandresvilchezarteaga@gmail.com" },
]
dependencies = [
  "flet>=1.0.3",
  "flet-datatable2>=0.86.5",
  "screeninfo>=0.8.1",
  "supabase>=2.31.0",
]

[dependency-groups]
dev = ["flet-cli>=0.85.3", "flet-desktop>=0.85.3", "flet-web>=0.85.3"]

[tool.flet]
desktop_flavor = "light"
org = "io.github.JoseV98"
product = "nutrilog"
company = "JoseV98"
copyright = "Copyright (C) 2026 por JoseV98"

[tool.flet.app]
path = "src"

[tool.pyright]
venvPath = "."
venv = ".venv"
